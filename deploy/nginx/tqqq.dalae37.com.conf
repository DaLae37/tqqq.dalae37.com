# Render deployment placeholders before including in the Nginx http context.
limit_req_zone $binary_remote_addr zone=tqqq_reader:10m rate=30r/m;

server {
    listen 80;
    server_name tqqq.dalae37.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tqqq.dalae37.com;

    ssl_certificate REPLACE_TLS_CERTIFICATE_PATH;
    ssl_certificate_key REPLACE_TLS_CERTIFICATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Verify VPC DNS support and namespace association before rendering.
    # Render the VPC Resolver address before applying; no task IP here.
    resolver REPLACE_VPC_RESOLVER_IP valid=10s ipv6=off;
    resolver_timeout 2s;
    set $dashboard_upstream REPLACE_DASHBOARD_PRIVATE_FQDN:3000;

    location / {
        proxy_pass http://$dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 70s;
    }

    location ~ ^/(?:$|strategy(?:/|$)|market(?:/|$)|trades(?:/|$)|portfolio(?:/|$)|engine(?:/|$)|dashboard(?:/|$)|api/dashboard(?:/|$)) {
        limit_req zone=tqqq_reader burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://$dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 70s;
        add_header Cache-Control "private, no-store" always;
        access_log off;
    }
}
